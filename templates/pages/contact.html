{% extends "base.html" %}
{% block title %}
Contact 
{% endblock title %}


{% load static %}


{% block content  %}
<section class="contact-session">
  <h1>Contact Me</h1>
  <form method="POST">
    {% csrf_token %}
    {{form.as_p}}
    <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Send</button>
    <button type="reset" class="btn btn-secondary">Cancel</button>
    </div>
  </form>
</section>
{% endblock content %}
