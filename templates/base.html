{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  
  <title>{% block title %}My Portfolio{% endblock title %}</title>
</head>

<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">

        <a class="navbar-brand" href="{% url 'about_me' %}">
          <img src="{% static 'img/CS-shield.png' %}" class="navbar-shield" alt="Courtney Swift — About Me"
  >
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">

            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'about_me' %}active{% endif %}"
                {% if request.resolver_match.url_name == 'about_me' %}aria-current="page"{% endif %}
                href="{% url 'about_me' %}"
              >
                About Me
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'experience' %}active{% endif %}"
                {% if request.resolver_match.url_name == 'experience' %}aria-current="page"{% endif %}
                href="{% url 'experience' %}"
              >
                Experience
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}"
                {% if request.resolver_match.url_name == 'projects' %}aria-current="page"{% endif %}
                href="{% url 'projects' %}"
              >
                Projects
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}
                href="{% url 'contact' %}"
              >
                Contact
              </a>
            </li>

          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Shared background around every page -->
  <main class="portfolio-page flex-grow-1">
    {% block content %}
    {% endblock content %}
  </main>

  <footer class="portfolio-footer text-center py-3">
    <small>© {% now "Y" %} Court Swift</small>
  </footer>

  <!-- Bootstrap JavaScript enables the mobile navigation -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</body>
</html>
